version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: orderdesk-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: orderdesk

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: orderdesk-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    volumes:
      - uploads-data:/app/uploads
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/orderdesk

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orderdesk-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - default
      - proxy-net

  # Führt "Version aktualisieren" aus Mein Konto aus (git pull, bauen, Neustart).
  # Nur intern erreichbar (kein ports:), Zugriff nur mit UPDATER_TOKEN.
  # ACHTUNG: Der Docker-Socket entspricht Root-Zugriff auf den Host - Token geheim halten.
  updater:
    build: ./updater
    container_name: orderdesk-updater
    restart: unless-stopped
    # Bewusst nur die zwei nötigen Werte (nicht die ganze .env mit SelectLine-Zugang etc.)
    environment:
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/repo
      - updater-state:/state
    depends_on:
      - backend

volumes:
  mongo-data:
  uploads-data:
  updater-state:

networks:
  default:
  # Gemeinsames Netzwerk für einen zukünftigen Reverse Proxy (z.B. Caddy).
  # Einmalig auf dem Server anlegen: docker network create proxy-net
  proxy-net:
    external: true
